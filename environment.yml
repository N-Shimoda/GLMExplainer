name: graphtoken
channels:
  - anaconda
  - pytorch
  - conda-forge
dependencies:
  - python=3.12
  - scipy
  - matplotlib
  - openai
  - pip
  - ninja
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch
    - torch_geometric
    - transformers
    - datasets
    - trl
    - peft
    - bitsandbytes
    - flash_attn
    - wandb